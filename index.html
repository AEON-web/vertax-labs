<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <style>
        body{font-family:'Times New Roman', Times, serif; margin: 60px;background:darkblue; color: white;}
        .container{max-width: 400px;background: darkslateblue;padding: 15px;border-radius: 20px;box-shadow: 3px 3px 3px black;}
        #taskInput{width: 200px; padding: 10px; border-radius: 5px; border: none; margin-top: 10px;}
        #addBtn{padding: 10px; border-radius: 5px; border: none; background-color: lightblue; color: black; margin-left: 10px; cursor: pointer;}
        #addBtn:hover{background-color: deepskyblue;}
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Task Manager</h1>
        <input type="text" id="taskInput" placeholder="Enter new task...">
        <button id="addBtn">Add</button>
        <ul id="taskList"></ul>
    </div>
 <script src="java.js"></script>   
</body>
</html>
