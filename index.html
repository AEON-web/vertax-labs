<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 960px;">
       <div class="row g-5">

        <div class="col-md-5 col-lg-4 order-md-last">
                <h4 class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-secondary">Your cart</span>
                </h4>

            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between lh-sm">
                    <div>
                        <h6 class="my-0">Product name</h6>
                        <small class="text-body-secondary">Brief description</small>
                    </div>
                        <span class="text-body-secondary">$12</span>
               </li>

               <li class="list-group-item d-flex justify-content-between lh-sm">
                    <div>
                        <h6 class="my-0">Second product</h6>
                        <small class="text-body-secondary">Brief description</small>
                    </div>
                        <span class="text-body-secondary">$8</span>
               </li>

               <li class="list-group-item d-flex justify-content-between lh-sm">
                    <div>
                        <h6 class="my-0">Third item</h6>
                        <small class="text-body-secondary">Brief description</small>
                    </div>
                        <span class="text-body-secondary">$5</span>
               </li>

               <li class="list-group-item d-flex justify-content-between bg-light">
                    <div class="text-success">
                        <h6 class="my-0">Promo code</h6>
                        <small>EXAMPLECODE</small>
                    </div> 
                        <span class="text-success">-$5</span>
               </li>

               <li class="list-group-item d-flex justify-content-between">
                    <span>Total (USD)</span>
                    <strong>$20</strong>
                </li>
            </ul>

            <form class="card p-2">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Promo code">
                        <button type="submit" class="btn btn-secondary">Redeem</button>
                    </div>
             </form>
         </div>

         <div class="col-md-7 col-lg-8">
            <h4 class="mb-3">Billing Address</h4>
            <form class="needs-validation" novalidate>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="FristName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstname" required>
                    </div>

                    <div class="col-sm-6">
                         <label for="LastName" class="form-label">Last Nmae</label>
                         <input type="text" class="form-control" id="lastname" required>
                    </div>

                    <div class="col-12">
                        <label for="UserName" class="form-label">username</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" id="Username" placeholder="Username" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label">Email <span class="text-body-secondary">(Optional)</span></label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com">
                    </div>

                    <div class="col-12">
                        <label for="Address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" placeholder="1234 Nkpor St" required>
                    </div>

                    <div class="col-12">
                        <label for="Address2" class="form-label">Address 2 <span class="text-body-secondary">(Optional)</span></label>
                        <input type="text" class="form-control" id="address" placeholder="Apartment or suite">
                    </div>

                    <div class="col-md-5">
                        <label for="country" class="form-label">Country</label>
                        <select class="form-select" id="country" required>
                            <option value="">Choose...</option>
                            <option>Nigeria</option>
                            <option>United state</option>
                            <option>italy</option>
                            <option>spain</option>
                            <option>mali</option>
                            <option>portugal</option>
                            <option>ivory coast</option>
                            <option>zambia</option>
                            <option>oman</option>
                            <option>japan</option>
                            <option>canada</option>
                            <option>algeria</option>
                            <option>korea</option>
                            <option>belgium</option>
                            <option>scotland</option>
                            <option>denmark</option>
                            <option>brazil</option>
                            <option>south africa</option>
                            <option>mexico</option>
                            <option>Qatar</option>
                            <option>Saudi Arabia</option>
                            <option>New york</option>
                            <option>England</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="state" class="form-label">State</label>
                        <select class="form-select" id="state" required>
                            <option value="">Choose...</option>
                            <option>Abuja</option>
                            <option>Carlifornia</option>
                            <option>Milian</option>
                            <option>Madrid</option>
                            <option>Mali</option>
                            <option>Lisbon</option>
                            <option>Coast</option>
                            <option>Zambia</option>
                            <option>Oman</option>
                            <option>Tokyo</option>
                            <option>Hiddenville</option>
                            <option>Swellview</option>
                            <option>Green land</option>
                            <option>South korea</option>
                            <option>Brugge</option>
                            <option>Olympiacos</option>
                            <option>Dutch</option>
                            <option>Santos</option>
                            <option>Sun down</option>
                            <option>Manchester</option>
                            <option>Barcelona</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="zip" class="form-label">Zip</label>
                        <input type="text" class="form-control" id="Zip" required>
                    </div>
                </div>

                <hr class="my-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="same-address">
                    <label class="form-check-label" for="same-address">Shipping adress is the same as my billing address</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="save-info">
                    <label class="form-check-label" for="save-info">Save this information for next time</label> 
                </div>

                <hr class="my-4">

                <h4 class="mb-3">Payment</h4>

                <div class="my-3">
                    <div class="form-check">
                        <input id="credit" name="paymentMethod" type="radio" class="form-check-input" checked required>
                        <label class="form-check-label" for="credit">Credit card</label>
                    </div>
                
                    <div class="form-check">
                        <input id="debit" name="paymentMethod" type="radio" class="form-check-input" checked required>
                        <label class="form-check-label" for="debit">Debit card</label>
                    </div>

                    <div class="form-check">
                        <input id="paypal" name="paymentMethod" type="radio" class="form-check-input" checked required>
                        <label class="form-check-label" for="paypal">Paypal</label>
                    </div>

                    <div class="row gy-3">
                        <div class="col-md-6">
                            <label for="cc-name" class="form-name">Name on card</label>
                            <input type="text" class="form-control" id="cc-name" required>
                            <small class="text-body-secondary">Full name as displayed on card</small>
                        </div>

                        <div class="col-md-6">
                            <label for="user-fullname" class="form-name">Credit card number</label>
                            <input type="text" class="form-control" id="user-fullname" required>
                        </div>

                        <div class="col-md-3">
                            <label for="cc-expiration" class="form-name">Expiration</label>
                            <input type="text" class="form-control" id="cc-expiration" required>
                        </div>

                        <div class="col-md-3">
                            <label for="cc-cvv" class="form-name">CVV</label>
                            <input type="text" class="form-control" id="cc-cvv" required>
                        </div>

                        <hr class="my-4">

                        <div class="col-12">
                            <button class="btn btn-primary btn-lg" type="submit">Continue to checkout</button>
                        </div>

                    </div>

                </div>
            </form>

         </div>

       </div>  
    </div>








 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>   
</body>
</html>
